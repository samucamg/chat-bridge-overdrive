<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>ChatGPT - Image Turn Fixture</title>
</head>
<body>
  <header>
    <a href="/" data-testid="create-new-chat-button" aria-label="Novo chat">Novo chat</a>
    <button data-testid="model-switcher-dropdown-button">ChatGPT 4o</button>
  </header>
  <main>
    <article data-testid="conversation-turn-1">
      <div data-message-author-role="user">
        <div class="user-message">
          <p>Gere uma imagem de um por do sol sobre as montanhas.</p>
        </div>
      </div>
    </article>
    <article data-testid="conversation-turn-2">
      <div data-message-author-role="assistant">
        <div class="markdown prose">
          <p>Aqui esta a imagem solicitada.</p>
          <img id="small-icon" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" width="32" height="32" alt="icone" />
        </div>
      </div>
      <div class="dalle-image-container">
        <img id="generated-img-turn" src="https://files.oaiusercontent.com/file-test-1" width="512" height="512" alt="Imagem gerada fora do div assistant" />
        <img id="generated-img-turn-2" src="https://files.oaiusercontent.com/file-test-2" width="1024" height="1024" alt="Segunda imagem gerada" />
      </div>
    </article>
  </main>
  <footer>
    <input id="file-upload" type="file" multiple style="display:none" />
    <div id="prompt-textarea" class="ProseMirror" contenteditable="true" role="textbox" aria-label="Envie uma mensagem"></div>
    <button type="button" data-testid="send-button" aria-label="Enviar prompt">Enviar</button>
    <button type="button" data-testid="stop-button" aria-label="Parar geracao" style="display:none">Parar</button>
  </footer>
</body>
</html>
